<!doctype html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1X0</title>
</head>
<style>
  body {
    overflow : hidden;
  }
  .columnColor {
    background-color:rgb(255, 255, 255);
    font-size: 30px;
  }B
 .bscore {
    font-size: x-large;
    color:saddlebrown;
  }
  .bresult {
    font-size: x-large;
    color:red;
 }
 .main-table {
    width: 100%;
    text-align: center;
  }
  .div-table {
    display: inline-grid;
    width: 80%;
    height: 100%; 
  }
  .div-table-row {
    display: inline-flex;
    width: 100%;
    }
  .div-table-row div {
    float: left; /* fix for  buggy browsers */
    display: inline;     
    width: 25%;
    height: 80px;
    line-height: 80px;
  }
  .div-table > div:first-child {
    border-bottom: 7px solid rgb(27, 160, 155);
  }
  .div-table > div:last-child {
    border-top: 7px solid rgb(27, 160, 155);
  }
  .div-table-row > div:first-child {
    border-right: 7px solid rgb(27, 160, 155)
  }
  .div-table-row > div:last-child {
    border-left: 7px solid rgb(27, 160, 155);
  }
  .div-table > div:nth-child(2) {
    border-bottom: 1px solid rgb(27, 160, 155);
  }
  .div-table-row > div:nth-child(2) {
    border-right: 1px solid rgb(27, 160, 155);
  }
  .div-table-row:first-child > div:first-child,
  .div-table-row:first-child > div:last-child,
  .div-table-row:last-child > div:first-child,
  .div-table-row:last-child > div:last-child   {
    background-color: rgb(252, 168, 168);
  }
  .operator {
    font-size: 100px;
    font-family:sans-serif;
  } 


</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>

  var objGame;
  var strCurrentOperation = "+";
  class game2048 {
    constructor() {
      this.gameBoard = [ ['','','',''], ['','','',''], ['','','',''], ['','','',''] ];
      this.gameScore = 0;
      this.animateCell = ",";
      this.firstNumberAssigned = false;
      this.MAX_ROW = 4;
    }

    boardRefresh() {
      var colName = '';
      for (var i=0; i < this.MAX_ROW; i++) {
        for (var j=0; j < this.MAX_ROW; j++) {
          colName = '#cell' + i + j;
          $(colName).text(this.gameBoard[i][j]);
          $(colName).removeClass().addClass("columnColor");
          if (this.animateCell.indexOf("," + colName + ",") >= 0)
            $(colName).animate({ "opacity": "0.5" }, 100).animate({ "opacity": "1.0" }, 100);
        }
      }
      this.animateCell = ",";
      $("#boardScore").text("Score : " + this.gameScore);
    }

    generateBoard(strBoard) {
      this.gameBoard = [];
      var tempArrayStr = strBoard.split(",").map(function(item) {
        return parseInt(item);
      });
      while (tempArrayStr.length > 0){
        this.gameBoard.push(tempArrayStr.splice(0,this.MAX_ROW));
      }
    }

    moveDown() {
      var isMoved = false;
      var isAnymoved = false;
      for (var i=0; i<this.MAX_ROW; i++) {
          var sum = (strCurrentOperation=="+")?0:1;
          isMoved = false;
        for (var j=0; j<this.MAX_ROW-1; j++) {
            if (this.gameBoard[j][i]==='') continue;
            if (strCurrentOperation==="+")
                sum+= this.gameBoard[j][i];
            else
                sum*= this.gameBoard[j][i];
            this.gameBoard[j][i]='';
            isMoved=true;
        }
        isAnymoved = isMoved || isAnymoved;
        if (strCurrentOperation==="+")
            if (this.gameBoard[j][i]==='') this.gameBoard[j][i] = isMoved?sum:'';
            else this.gameBoard[j][i] += sum;
        else
        if (this.gameBoard[j][i]==='') this.gameBoard[j][i] = isMoved?sum:'';
            else this.gameBoard[j][i] *= sum;
      }
      if (!this.isGameOver())
        $("#boardResult").text("Game Over");
      return isAnymoved;
    }

    moveUp() {
      var isMoved = false;
      var isAnymoved = false;
      for (var i=0; i<this.MAX_ROW; i++) {
          var sum = (strCurrentOperation=="+")?0:1;
          isMoved = false;
        for (var j=1; j<this.MAX_ROW; j++) {
            if (this.gameBoard[j][i]==='') continue;
            if (strCurrentOperation==="+")
                sum+= this.gameBoard[j][i];
            else
                sum*= this.gameBoard[j][i];
            this.gameBoard[j][i]='';
            isMoved=true;
        }
        isAnymoved = isMoved || isAnymoved;
        if (strCurrentOperation==="+")
            if (this.gameBoard[0][i]==='') this.gameBoard[0][i] = isMoved?sum:'';
            else this.gameBoard[0][i] += sum;
        else
        if (this.gameBoard[0][i]==='') this.gameBoard[0][i] = isMoved?sum:'';
            else this.gameBoard[0][i] *= sum;
      }
      if (!this.isGameOver())
        $("#boardResult").text("Game Over");
      return isAnymoved;
    }

    moveLeft() {
        var isMoved = false;
      var isAnymoved = false;
      for (var i=0; i<this.MAX_ROW; i++) {
          var sum = (strCurrentOperation=="+")?0:1;
          isMoved = false;
        for (var j=1; j<this.MAX_ROW; j++) {
            if (this.gameBoard[i][j]==='') continue;
            if (strCurrentOperation==="+")
                sum+= this.gameBoard[i][j];
            else
                sum*= this.gameBoard[i][j];
            this.gameBoard[i][j]='';
            isMoved=true;
        }
        isAnymoved = isMoved || isAnymoved;
        if (strCurrentOperation==="+")
            if (this.gameBoard[i][0]==='') this.gameBoard[i][0] = isMoved?sum:'';
            else this.gameBoard[i][0] += sum;
        else
        if (this.gameBoard[i][0]==='') this.gameBoard[i][0] = isMoved?sum:'';
            else this.gameBoard[i][0] *= sum;
      }
      if (!this.isGameOver())
        $("#boardResult").text("Game Over");
      return isAnymoved;
    }

    moveRight() {
      var isMoved = false;
      var isAnymoved = false;
      for (var i=0; i<this.MAX_ROW; i++) {
          var sum = (strCurrentOperation=="+")?0:1;
          isMoved = false;
        for (var j=0; j<this.MAX_ROW-1; j++) {
            if (this.gameBoard[i][j]==='') continue;
            if (strCurrentOperation==="+")
                sum+= this.gameBoard[i][j];
            else
                sum*= this.gameBoard[i][j];
            this.gameBoard[i][j]='';
            isMoved=true;
        }
        isAnymoved = isMoved || isAnymoved;
        if (strCurrentOperation==="+")
            if (this.gameBoard[i][j]==='') this.gameBoard[i][j] = isMoved?sum:'';
            else this.gameBoard[i][j] += sum;
        else
        if (this.gameBoard[i][j]==='') this.gameBoard[i][j] = isMoved?sum:'';
            else this.gameBoard[i][j] *= sum;
      }
      if (!this.isGameOver())
        $("#boardResult").text("Game Over");
      return isAnymoved;
    }

    generateRandomNo() {
      if ($("#boardResult").text().length>0) {
        return;
      } 
      let rand, brow, bcol, randDigit, assigned = false;
      if (Math.floor((Math.random()*2)) == 1 || !this.firstNumberAssigned) randDigit=1; else randDigit=0;
      this.firstNumberAssigned = true;
      while (!assigned){
        rand = Math.floor((Math.random()*4));
        brow = Math.floor(rand / 2) + 1;
        bcol = (rand % 2) + 1;
        if (this.gameBoard[brow][bcol] == '') {
          this.gameBoard[brow][bcol] = randDigit;
          this.animateCell += '#cell' + brow + bcol + ",";
          assigned = true;
        }
      }
      this.boardRefresh();
    }

    isGameOver() {
      this.gameScore=0;
      var strDoubleCells = ",0,3,12,15,";
      var GScore = 0;
      //this.gameBoard.join().split(",").map((a) => { this.gameScore+= parseInt("0" + a); });
      this.gameBoard.join().split(",").map(function(val, ind) {
        if (strDoubleCells.indexOf(","+ind+",") >= 0)
          GScore+= parseInt("0" + val) * 2;
        else 
          GScore+= parseInt("0" + val);
      })
      this.gameScore = GScore; 
      $("#boardScore").text(this.gameScore);
      return (this.gameBoard.join().replaceAll(",","").replaceAll("0","").length>0);
    }

    resetBoard() {
      this.gameBoard = [ ['','','',''], ['','','',''], ['','','',''], ['','','',''] ];
      this.gameScore=0;
      this.generateRandomNo();
      this.boardRefresh();
      $("#boardResult").text("");
    }
  } // class ends

  //******* touchstart and touchmove *******//
  var xDown = null;                                                        
  var yDown = null;

  function getTouches(evt) {
    return evt.touches ||             // browser API
          evt.originalEvent.touches; // jQuery
  }                                                     
                                                                          
  function handleTouchStart(evt) {
      const firstTouch = getTouches(evt)[0];                                      
      xDown = firstTouch.clientX;                                      
      yDown = firstTouch.clientY;                                      
  };                                                
                                                                          
  function handleTouchMove(evt) {
    if ( ! xDown || ! yDown ) {
        return;
    }

    var xUp = evt.touches[0].clientX;                                    
    var yUp = evt.touches[0].clientY;

    var xDiff = xDown - xUp;
    var yDiff = yDown - yUp;
                                                                        
    if ( Math.abs( xDiff ) > Math.abs( yDiff ) ) {/*most significant*/
        if ( xDiff > 0 ) {
            /* left swipe */ 
            if (objGame.moveLeft()) objGame.generateRandomNo();
        } else {
            /* right swipe */
             if (objGame.moveRight()) objGame.generateRandomNo();
        }                       
    } else {
        if ( yDiff > 0 ) {
            /* up swipe */ 
            if (objGame.moveUp()) objGame.generateRandomNo();
        } else { 
            /* down swipe */
            if (objGame.moveDown()) objGame.generateRandomNo();
        }                                                                 
    }
    /* reset values */
    xDown = null;
    yDown = null;      
  };
//******* touchstart and touchmove *******//

function handleKeyDown(evt) {
  if (event.defaultPrevented) {
    return; // Do nothing if the event was already processed
  }
  switch (evt.key) {
    case "Down":
    case "ArrowDown": 
      if (objGame.moveDown()) objGame.generateRandomNo();
      break;
    case "Up":
    case "ArrowUp": 
      if (objGame.moveUp()) objGame.generateRandomNo();
      break;
    case "Left":
    case "ArrowLeft": 
      if (objGame.moveLeft()) objGame.generateRandomNo();
      break;
    case "Right":
    case "ArrowRight": 
      if (objGame.moveRight()) objGame.generateRandomNo();
      break;
    default: return;
  }
  evt.preventDefault();
};

$(document).ready(function() {
  document.addEventListener('touchstart', handleTouchStart, false);        
  document.addEventListener('touchmove', handleTouchMove, false);
  document.addEventListener('keydown', handleKeyDown, false);

  objGame = new game2048;
  objGame.generateRandomNo();
  objGame.boardRefresh();

  var strRotateDegree = 0;
  var isRotationOnHold = false;
  var intRotationHoldCounter = 0;
  setInterval(function() {
    if (strRotateDegree%45==0) isRotationOnHold = true;
    if (!isRotationOnHold) {
      document.getElementById("lblCurrentOperation").style.transform = 'rotate('+strRotateDegree+'deg)' ;
      strRotateDegree+=5; 
      if (strRotateDegree>360) strRotateDegree = 5;
    }
    else {
      if (strRotateDegree%90==0) strCurrentOperation = "+";
        else strCurrentOperation = "*";
      if (intRotationHoldCounter++>5) {
        isRotationOnHold=false;
        intRotationHoldCounter=0;
        strRotateDegree+=5; 
        if (strRotateDegree>360) strRotateDegree = 5;
      }
    }
  }, 500);
})


</script>
<body>

  <div class="main-table">
    <form>
      <div><span class="bscore" id="boardScore"></span></div>
      <div id="lblCurrentOperation" class="operator">+</div>
      <div class="div-table" id="maindiv">
        <div class="div-table-row" id="rowdiv">
          <div id="cell00"></div>
          <div id="cell01"></div>
          <div id="cell02"></div>
          <div id="cell03"></div>
        </div>
        <div class="div-table-row">          
          <div id="cell10"></div>
          <div id="cell11"></div>
          <div id="cell12"></div>
          <div id="cell13"></div>
        </div>
        <div class="div-table-row">  
          <div id="cell20"></div>
          <div id="cell21"></div>
          <div id="cell22"></div>
          <div id="cell23"></div>
        </div>
        <div class="div-table-row">
          <div id="cell30"></div>
          <div id="cell31"></div>
          <div id="cell32"></div>
          <div id="cell33"></div>
        </div> 
      </div>
      <div>&nbsp;</div>
      <div><span class="bresult" id="boardResult"></span></div>
      <div>&nbsp;</div>
      <div><input style="width:100px; height:50px" type="button" value="NEW" onclick="objGame.resetBoard();"></div>
    </form> 
  </div>
  
</body>
</html>
